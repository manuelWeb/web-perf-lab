name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to mini-forum
    runs-on: self-hosted

    steps:
      - name: Deploy
        run: |
          set -e
          cd /opt/apps/web-perf-lab
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          docker compose build
          docker compose up -d --wait
