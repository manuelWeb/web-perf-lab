name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to mini-forum
    runs-on: self-hosted

    steps:
      - name: Deploy
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: |
          set -e
          cd /opt/apps/web-perf-lab
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          export NEXT_PUBLIC_DATADOG_VERSION="$(git rev-parse --short=7 HEAD)"
          if [ -n "$DD_API_KEY" ]; then
            docker compose -f docker-compose.yml -f docker-compose.datadog.yml build
          else
            docker compose build
          fi
          docker compose up -d --wait --no-build
