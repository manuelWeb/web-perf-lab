# Template versionné, non utilisé directement par nginx.
# À copier vers /etc/nginx/conf.d/webperfs.webdesignord.fr.conf sur le serveur,
# puis `nginx -t && systemctl reload nginx`. Cette version reflète l'état HTTPS
# actif sur le serveur (blocs TLS et redirection ajoutés par Certbot).
server {
    server_name webperfs.webdesignord.fr www.webperfs.webdesignord.fr;

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    http2 on;
    ssl_certificate /etc/letsencrypt/live/webperfs.webdesignord.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/webperfs.webdesignord.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = www.webperfs.webdesignord.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = webperfs.webdesignord.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name webperfs.webdesignord.fr www.webperfs.webdesignord.fr;
    return 404; # managed by Certbot

}
