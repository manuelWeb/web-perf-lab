# Template versionné, non utilisé directement par nginx.
# À copier vers /etc/nginx/conf.d/webperfs.webdesignord.fr.conf sur le serveur,
# puis `nginx -t && systemctl reload nginx`. Certbot modifiera ensuite ce fichier
# côté serveur (TLS + redirection HTTPS) ; reporter ces changements ici manuellement.
server {
    listen 80;
    listen [::]:80;
    server_name webperfs.webdesignord.fr www.webperfs.webdesignord.fr;

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
