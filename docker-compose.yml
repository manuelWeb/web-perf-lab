services:
  app:
    build:
      context: .
      additional_contexts:
        dotgit: .git
      args:
        # Compose lit ces valeurs dans le fichier .env du projet.
        NEXT_PUBLIC_GTM_ID: "${NEXT_PUBLIC_GTM_ID:-}"
        NEXT_PUBLIC_DATADOG_APPLICATION_ID: "${NEXT_PUBLIC_DATADOG_APPLICATION_ID:-}"
        NEXT_PUBLIC_DATADOG_CLIENT_TOKEN: "${NEXT_PUBLIC_DATADOG_CLIENT_TOKEN:-}"
        NEXT_PUBLIC_DATADOG_ENV: "${NEXT_PUBLIC_DATADOG_ENV:-production}"
        NEXT_PUBLIC_DATADOG_VERSION: "${NEXT_PUBLIC_DATADOG_VERSION:-}"
    container_name: web-perf-lab-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3040:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
